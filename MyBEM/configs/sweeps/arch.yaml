base: tcn_baseline.yaml

runs:
  - name: arch_tcn

  - name: arch_mlp_64
    net: {arch: mlp, neurons: [64, 32], two_heads: true}
  - name: arch_mlp_128
    net: {arch: mlp, neurons: [128, 64], two_heads: true}
  - name: arch_mlp_256
    net: {arch: mlp, neurons: [256, 128], two_heads: true}

  - name: arch_dtcn_16
    net: {arch: dtcn, channels: 16, dilations: [1, 2, 2], kernel: 3, neurons: [20], two_heads: true}
  - name: arch_dtcn_32
    net: {arch: dtcn, channels: 32, dilations: [1, 2, 2], kernel: 3, neurons: [20], two_heads: true}
  - name: arch_dtcn_48
    net: {arch: dtcn, channels: 48, dilations: [1, 2, 2], kernel: 3, neurons: [20], two_heads: true}

  - name: arch_lstm_32
    net: {arch: lstm, hidden: 32, layers: 1, neurons: [20], two_heads: true}
  - name: arch_lstm_48
    net: {arch: lstm, hidden: 48, layers: 1, neurons: [20], two_heads: true}
  - name: arch_lstm_64
    net: {arch: lstm, hidden: 64, layers: 1, neurons: [20], two_heads: true}

  - name: arch_linear
    net: {arch: linear}
  - name: arch_linear_l2_4
    net: {arch: linear}
    optim: {l2: 1.0e-4}
  - name: arch_linear_l2_2
    net: {arch: linear}
    optim: {l2: 1.0e-2}
